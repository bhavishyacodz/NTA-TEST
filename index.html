<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex JEE — Next-Gen Exam Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

<style>
  :root {
    --bg-base: #030712;
    --bg-card: rgba(17, 24, 39, 0.75);
    --border-glass: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.4);
    --accent: #ec4899;
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
  body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 40%); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

  /* DASHBOARD UI */
  #dashboard { padding: 30px 20px; height: 100vh; overflow-y: auto; max-width: 1000px; margin: 0 auto; width: 100%; }
  .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #818cf8, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
  .badge-beta { background: rgba(99, 102, 241, 0.15); color: #818cf8; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(99, 102, 241, 0.3); }

  .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  
  /* ACCORDION / FOLDER STYLE LIST */
  .catalog-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .folder-card { background: var(--bg-card); border: 1px solid var(--border-glass); backdrop-filter: blur(12px); border-radius: 14px; overflow: hidden; transition: 0.2s; }
  .folder-header { padding: 18px 20px; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.01); }
  .folder-header:hover { background: rgba(255,255,255,0.03); }
  .folder-content { display: none; padding: 15px 20px; border-top: 1px solid var(--border-glass); display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.2); }
  .folder-content.open { display: flex; }

  .shift-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); padding: 14px 18px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
  .shift-item:hover { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); transform: translateX(4px); }
  .shift-title { font-weight: 500; font-size: 0.95rem; }
  .launch-btn { background: var(--primary); color: white; padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 4px 12px var(--primary-glow); }

  /* TEST TAKING INTERFACE */
  #test-screen { display: none; flex-direction: column; height: 100vh; background: var(--bg-base); }
  .test-header { background: rgba(17, 24, 39, 0.9); border-bottom: 1px solid var(--border-glass); backdrop-filter: blur(10px); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .test-title-display { font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
  .timer-pill { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 6px 16px; border-radius: 30px; font-family: monospace; font-size: 1.2rem; font-weight: 600; }
  
  .test-body { display: flex; flex: 1; overflow: hidden; }
  .question-area { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
  .tabs-container { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid var(--border-glass); padding-bottom: 12px; }
  .subject-tab { background: transparent; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; padding: 8px 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .subject-tab.active { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

  .q-card { background: var(--bg-card); border: 1px solid var(--border-glass); backdrop-filter: blur(16px); border-radius: 20px; padding: 30px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
  .q-text { font-size: 1.25rem; line-height: 1.6; margin-bottom: 25px; color: #f3f4f6; }
  
  .options-stack { display: flex; flex-direction: column; gap: 12px; }
  .option-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass); padding: 15px 20px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; }
  .option-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
  .option-item input { accent-color: var(--primary); transform: scale(1.2); }
  
  .q-actions { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
  .btn-save { background: var(--success); color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
  .btn-mark { background: var(--warning); color: #111827; }
  .btn-clear { background: rgba(255,255,255,0.08); color: var(--text-muted); border: 1px solid var(--border-glass); }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }

  /* PALETTE SIDEBAR */
  .palette-sidebar { width: 320px; background: rgba(17, 24, 39, 0.85); border-left: 1px solid var(--border-glass); backdrop-filter: blur(16px); padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
  .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; overflow-y: auto; max-height: 45vh; padding-right: 5px; }
  .palette-btn { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border-glass); font-weight: 600; font-size: 0.9rem; cursor: pointer; background: rgba(255,255,255,0.03); color: var(--text-muted); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
  .palette-btn.not-visited { background: rgba(255,255,255,0.03); color: var(--text-muted); }
  .palette-btn.answered { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.4); color: var(--success); }
  .palette-btn.marked { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.4); color: var(--warning); }
  .palette-btn.current { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
  
  .btn-submit-final { background: var(--danger); color: white; width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); transition: 0.2s; }
  .btn-submit-final:hover { opacity: 0.9; }

  @media(max-width: 768px) {
    .test-body { flex-direction: column; }
    .palette-sidebar { width: 100%; max-height: 250px; border-left: none; border-top: 1px solid var(--border-glass); }
    .palette-grid { max-height: 120px; }
  }
</style>
</head>
<body>

<!-- DASHBOARD MENU (NO SEARCH REQUIRED) -->
<div id="dashboard">
  <div class="nav-header">
    <div class="logo">⚡ VORTEX <span style="font-weight: 300; color: #fff;">JEE</span></div>
    <div class="badge-beta">Select Paper</div>
  </div>

  <div class="section-title">
    <span>Available Question Papers</span>
    <span id="test-count" style="font-size:0.85rem; color:var(--text-muted);">Loading...</span>
  </div>

  <div class="catalog-container" id="catalog-list">
    <!-- Folders and shifts injected automatically -->
  </div>
</div>

<!-- TEST TAKING INTERFACE -->
<div id="test-screen">
  <div class="test-header">
    <div class="test-title-display" id="test-title-display">Loading Session...</div>
    <div class="timer-pill" id="timer">180:00</div>
  </div>
  <div class="test-body">
    <div class="question-area">
      <div class="tabs-container" id="subject-tabs"></div>
      <div class="q-card">
        <div>
          <div class="q-text" id="q-text">Initializing question container...</div>
          <div class="options-stack" id="q-options"></div>
        </div>
        <div class="q-actions">
          <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
          <button class="btn btn-mark" onclick="markForReview()">Mark for Review</button>
          <button class="btn btn-clear" onclick="clearResponse()">Clear Response</button>
        </div>
      </div>
    </div>
    
    <div class="palette-sidebar">
      <div>
        <h4 id="palette-title" style="font-size: 0.95rem; font-weight: 600; color: #d1d5db;">Question Palette</h4>
        <div class="palette-grid" id="q-palette"></div>
      </div>
      <button class="btn-submit-final" onclick="submitTest()">Submit Assessment</button>
    </div>
  </div>
</div>

<script>
  let questions = {};
  let currentSubject = '';
  let currentIndex = 0;
  let responses = {};
  let timeLeft = 180 * 60;
  let timerInterval;

  // Fetch Index and Group by Year/Session automatically
  fetch('test_index.json')
    .then(res => res.json())
    .then(data => {
      document.getElementById('test-count').innerText = `${data.length} test(s) loaded`;
      const container = document.getElementById('catalog-list');
      container.innerHTML = '';

      // Group tests into a default "JEE Mains PYQ Papers" folder if no explicit grouping is provided
      container.innerHTML = `
        <div class="folder-card">
          <div class="folder-header" onclick="toggleFolder(this)">
            <span>📚 JEE Mains Previous Year Papers</span>
            <span style="font-size: 0.85rem; color: var(--text-muted);">▼</span>
          </div>
          <div class="folder-content open" id="folder-shifts"></div>
        </div>`;

      const shiftContainer = document.getElementById('folder-shifts');
      data.forEach(test => {
        shiftContainer.innerHTML += `
          <div class="shift-item" onclick="startTest('${test.file}', '${test.title}')">
            <span class="shift-title">${test.title}</span>
            <span class="launch-btn">Start Test</span>
          </div>`;
      });
    })
    .catch(() => {
      document.getElementById('catalog-list').innerHTML = `
        <div style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); padding: 20px; border-radius: 12px; color: #fca5a5;">
          ⚠️ <b>test_index.json not found.</b> Make sure it is uploaded in your GitHub repository.
        </div>`;
      document.getElementById('test-count').innerText = "0 tests";
    });

  function toggleFolder(header) {
    const content = header.nextElementSibling;
    content.classList.toggle('open');
  }

  function startTest(jsonFile, title) {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('test-screen').style.display = 'flex';
    document.getElementById('test-title-display').innerText = title;
    
    responses = {};
    timeLeft = 180 * 60;

    fetch(jsonFile)
      .then(res => {
        if(!res.ok) throw new Error("File missing");
        return res.json();
      })
      .then(data => {
        questions = data;
        Object.keys(data).forEach(subj => responses[subj] = new Array(data[subj].length).fill(null));
        currentSubject = Object.keys(data)[0];
        renderTabs();
        loadSubject(currentSubject);
        
        timerInterval = setInterval(() => {
          if (timeLeft <= 0) { clearInterval(timerInterval); submitTest(); return; }
          timeLeft--;
          let h = Math.floor(timeLeft / 3600);
          let m = Math.floor((timeLeft % 3600) / 60);
          let s = timeLeft % 60;
          document.getElementById('timer').innerText = `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);
      })
      .catch(() => {
        document.querySelector('.question-area').innerHTML = `
          <div style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); padding: 30px; border-radius: 16px; color: #fca5a5; text-align: center;">
            <h3>Error Loading Test File</h3>
            <p style="margin-top: 10px;">Could not fetch <b>${jsonFile}</b>. Verify that this file is uploaded on GitHub.</p>
            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">Return to Dashboard</button>
          </div>`;
      });
  }

  function renderTabs() {
    const container = document.getElementById('subject-tabs');
    container.innerHTML = '';
    Object.keys(questions).forEach(subj => {
      container.innerHTML += `<button class="subject-tab ${subj === currentSubject ? 'active' : ''}" onclick="loadSubject('${subj}')">${subj}</button>`;
    });
  }

  function loadSubject(subj) {
    currentSubject = subj;
    currentIndex = 0;
    renderTabs();
    renderQuestion();
    renderPalette();
  }

  function renderQuestion() {
    const q = questions[currentSubject][currentIndex];
    const qDiv = document.getElementById('q-text');
    qDiv.innerHTML = `<b>Q${currentIndex + 1}.</b> ${q.text}`;
    
    const optionsContainer = document.getElementById('q-options');
    optionsContainer.innerHTML = '';
    
    q.options.forEach((opt, i) => {
      const isChecked = responses[currentSubject][currentIndex]?.ans === i ? 'checked' : '';
      optionsContainer.innerHTML += `
        <label class="option-item" onclick="document.getElementById('opt-${i}').checked = true">
          <input type="radio" name="jee-opt" id="opt-${i}" value="${i}" ${isChecked}>
          <span>${opt}</span>
        </label>`;
    });

    if(window.renderMathInElement) {
      renderMathInElement(qDiv);
      document.querySelectorAll('.option-item span').forEach(el => renderMathInElement(el));
    }
  }

  function renderPalette() {
    document.getElementById('palette-title').innerText = `${currentSubject} Palette`;
    const grid = document.getElementById('q-palette');
    grid.innerHTML = '';
    
    questions[currentSubject].forEach((_, i) => {
      const st = responses[currentSubject][i]?.state || 'not-visited';
      const isCurr = i === currentIndex ? 'current' : '';
      grid.innerHTML += `<button class="palette-btn ${st} ${isCurr}" onclick="jumpToQuestion(${i})">${i + 1}</button>`;
    });
  }

  function jumpToQuestion(i) {
    currentIndex = i;
    renderQuestion();
    renderPalette();
  }

  function saveResponse(state) {
    const selected = document.querySelector('input[name="jee-opt"]:checked');
    if (selected) {
      responses[currentSubject][currentIndex] = { ans: parseInt(selected.value), state: state };
    } else if (state === 'marked') {
      responses[currentSubject][currentIndex] = { ans: null, state: 'marked' };
    }
  }

  function saveAndNext() {
    saveResponse('answered');
    if (currentIndex < questions[currentSubject].length - 1) {
      currentIndex++;
      renderQuestion();
      renderPalette();
    }
  }

  function markForReview() {
    saveResponse('marked');
    if (currentIndex < questions[currentSubject].length - 1) {
      currentIndex++;
      renderQuestion();
      renderPalette();
    }
  }

  function clearResponse() {
    responses[currentSubject][currentIndex] = null;
    renderQuestion();
    renderPalette();
  }

  function submitTest() {
    clearInterval(timerInterval);
    let score = 0, correct = 0, wrong = 0, unattempted = 0;
    
    Object.keys(questions).forEach(subj => {
      questions[subj].forEach((q, i) => {
        const res = responses[subj][i];
        if (res && res.ans !== null) {
          if (res.ans === q.correct) { score += 4; correct++; }
          else { score -= 1; wrong++; }
        } else {
          unattempted++;
        }
      });
    });

    document.getElementById('test-screen').innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:20px; text-align:center;">
        <div style="background:var(--bg-card); border:1px solid var(--border-glass); backdrop-filter:blur(20px); padding:40px; border-radius:24px; max-width:450px; width:100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
          <h1 style="font-size:2rem; margin-bottom:10px; background:linear-gradient(135deg,#818cf8,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Assessment Complete</h1>
          <div style="font-size:3.5rem; font-weight:700; color:#fff; margin:20px 0;">${score} <span style="font-size:1.2rem; color:var(--text-muted);">/ 300</span></div>
          <div style="display:flex; flex-direction:column; gap:10px; text-align:left; margin-bottom:30px; font-size:0.95rem; background:rgba(255,255,255,0.02); padding:15px; border-radius:12px; border:1px solid var(--border-glass);">
            <div style="color:var(--success)">✅ Correct: ${correct} (+${correct * 4})</div>
            <div style="color:var(--danger)">❌ Incorrect: ${wrong} (-${wrong})</div>
            <div style="color:var(--text-muted)">⚪ Unattempted: ${unattempted}</div>
          </div>
          <button onclick="location.reload()" class="btn btn-save" style="width:100%;">Return to Command Center</button>
        </div>
      </div>`;
  }
</script>
</body>
</html>
