<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTA Free Test Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .hidden-solution { display: none; }
        .visible-solution { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .math-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 5px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <h1 class="text-xl font-bold tracking-wider cursor-pointer" onclick="showCatalog()">📝 Test Portal</h1>
            <button id="backBtn" class="hidden bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded text-sm transition" onclick="showCatalog()">
                &larr; Back to Tests
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Screen 1: Catalog -->
        <div id="catalogScreen">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900">Available Tests</h2>
                <p class="text-gray-500 mt-2">Select a paper below to begin.</p>
            </div>
            <div id="catalogContainer" class="space-y-8">
                <!-- Dynamically populated by JS -->
                <div class="text-center text-gray-500 py-10">Loading tests...</div>
            </div>
        </div>

        <!-- Screen 2: Paper Viewer -->
        <div id="paperScreen" class="hidden">
            <div class="mb-6 border-b pb-4">
                <h2 id="paperTitle" class="text-2xl font-bold text-gray-900">Paper Title</h2>
            </div>

            <!-- Subject Tabs -->
            <div id="subjectTabs" class="flex space-x-2 border-b mb-6 overflow-x-auto">
                <!-- Tabs injected here -->
            </div>

            <!-- Questions Container -->
            <div id="questionsContainer" class="space-y-8">
                <!-- Questions injected here -->
            </div>
        </div>

    </main>

    <script>
        let currentPaperData = null;
        let currentSubject = null;

        // 1. Fetch the Catalog
        async function loadCatalog() {
            try {
                const res = await fetch('test_index.json');
                const catalog = await res.json();
                renderCatalog(catalog);
            } catch (err) {
                document.getElementById('catalogContainer').innerHTML = 
                    `<div class="text-red-500 text-center">Failed to load catalog. Run your python script to generate tests.</div>`;
            }
        }

        // 2. Render the Catalog UI
        function renderCatalog(catalog) {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            for (const [exam, years] of Object.entries(catalog)) {
                const examSection = document.createElement('div');
                examSection.innerHTML = `<h3 class="text-2xl font-bold text-indigo-600 mb-4 border-b-2 border-indigo-100 pb-2">${exam}</h3>`;
                
                for (const [year, papers] of Object.entries(years)) {
                    const yearBlock = document.createElement('div');
                    yearBlock.className = 'mb-6 pl-4 border-l-4 border-indigo-400';
                    yearBlock.innerHTML = `<h4 class="text-lg font-semibold text-gray-700 mb-3">${year}</h4>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4';
                    
                    papers.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'bg-white p-4 rounded-lg shadow hover:shadow-md transition cursor-pointer border border-gray-100 flex items-center justify-between';
                        card.innerHTML = `
                            <span class="font-medium text-gray-800">${p.title}</span>
                            <span class="text-indigo-500 text-xl">&rarr;</span>
                        `;
                        card.onclick = () => loadPaper(p.file, p.title);
                        grid.appendChild(card);
                    });
                    
                    yearBlock.appendChild(grid);
                    examSection.appendChild(yearBlock);
                }
                container.appendChild(examSection);
            }
        }

        // 3. Fetch a specific paper JSON
        async function loadPaper(filename, title) {
            document.getElementById('catalogScreen').classList.add('hidden');
            document.getElementById('paperScreen').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('paperTitle').innerText = `Loading...`;
            document.getElementById('questionsContainer').innerHTML = `<div class="text-center py-10">Loading questions...</div>`;
            document.getElementById('subjectTabs').innerHTML = '';

            try {
                const res = await fetch(filename);
                currentPaperData = await res.json();
                document.getElementById('paperTitle').innerText = title;
                setupSubjectTabs();
            } catch (err) {
                document.getElementById('questionsContainer').innerHTML = `<div class="text-red-500 text-center">Failed to load paper data.</div>`;
            }
        }

        // 4. Setup Tabs for Subjects
        function setupSubjectTabs() {
            const questions = currentPaperData.questions || [];
            const subjects = [...new Set(questions.map(q => q.subject).filter(Boolean))];
            
            const tabsContainer = document.getElementById('subjectTabs');
            tabsContainer.innerHTML = '';

            if (subjects.length === 0) {
                currentSubject = "All";
                renderQuestions(questions);
                return;
            }

            currentSubject = subjects[0];

            subjects.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 font-medium rounded-t-lg transition-colors focus:outline-none ${sub === currentSubject ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`;
                btn.innerText = sub;
                btn.onclick = () => {
                    currentSubject = sub;
                    Array.from(tabsContainer.children).forEach(c => {
                        c.className = `px-4 py-2 font-medium rounded-t-lg transition-colors focus:outline-none ${c.innerText === currentSubject ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`;
                    });
                    renderQuestions(questions.filter(q => q.subject === sub));
                };
                tabsContainer.appendChild(btn);
            });

            renderQuestions(questions.filter(q => q.subject === currentSubject));
        }

        // 5. Render Questions
        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            if (questions.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center py-5">No questions found for this section.</div>`;
                return;
            }

            questions.forEach((q, idx) => {
                const qNum = q.question_number || (idx + 1);
                const qText = (q.text || '').replace(/\n/g, '<br>');
                
                let imgHtml = '';
                if (q.has_diagram && q.image) {
                    imgHtml = `<div class="my-4"><img src="images/${q.image}" class="max-w-full h-auto border rounded shadow-sm" alt="Diagram" loading="lazy"></div>`;
                }

                let optionsHtml = '';
                if (q.options && q.options.length > 0) {
                    optionsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">';
                    const labels = ['A', 'B', 'C', 'D'];
                    q.options.forEach((opt, i) => {
                        optionsHtml += `
                            <div class="p-3 border rounded bg-gray-50 flex items-start">
                                <span class="font-bold mr-3 text-indigo-600">${labels[i] || '•'}</span>
                                <span class="math-scroll">${opt.replace(/\n/g, '<br>')}</span>
                            </div>`;
                    });
                    optionsHtml += '</div>';
                }

                const solId = `sol-${qNum}-${Math.random().toString(36).substr(2, 9)}`;
                const solText = (q.solution || 'No solution provided.').replace(/\n/g, '<br>');

                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-lg shadow-sm border border-gray-200';
                card.innerHTML = `
                    <div class="flex items-start">
                        <div class="flex-shrink-0 bg-indigo-100 text-indigo-700 font-bold h-8 w-8 rounded-full flex items-center justify-center mr-4 mt-1">
                            ${qNum}
                        </div>
                        <div class="flex-grow w-full overflow-hidden">
                            <div class="text-gray-800 text-lg math-scroll">${qText}</div>
                            ${imgHtml}
                            ${optionsHtml}
                            
                            <div class="mt-6 border-t pt-4">
                                <button onclick="toggleSolution('${solId}')" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 focus:outline-none">
                                    👁️ Show / Hide Solution
                                </button>
                                <div id="${solId}" class="hidden-solution mt-4 p-4 bg-green-50 border border-green-200 rounded text-gray-800 math-scroll">
                                    <strong class="text-green-800 mb-2 block">Solution:</strong>
                                    ${solText}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (window.MathJax) {
                MathJax.typesetPromise([container]).catch((err) => console.log('MathJax error:', err));
            }
        }

        // Utility: Toggle Solution
        function toggleSolution(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden-solution')) {
                el.classList.remove('hidden-solution');
                el.classList.add('visible-solution');
            } else {
                el.classList.add('hidden-solution');
                el.classList.remove('visible-solution');
            }
        }

        // Utility: Back to Catalog
        function showCatalog() {
            document.getElementById('paperScreen').classList.add('hidden');
            document.getElementById('catalogScreen').classList.remove('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            currentPaperData = null;
        }

        window.onload = loadCatalog;
    </script>
</body>
</html>
